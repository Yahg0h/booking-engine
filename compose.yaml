services:
  # ----------------------------------------
  # MySQL 8.0 Database
  # ----------------------------------------
  db:
    image: mysql:8.0
    container_name: booking_engine_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: booking_engine
      MYSQL_USER: booking_admin
      MYSQL_PASSWORD: SenhaSegura123!
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql                            # Persist data across restarts
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql  # Auto-apply schema on first run
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # Redis
  # ----------------------------------------
  redis:
    image: redis:latest
    container_name: booking_engine_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data                                     # Persist data across restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # FastAPI Application
  # ----------------------------------------
  api:
    build: .
    container_name: booking_engine_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override hosts to point to Docker service names
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app                                       # Hot-reload support (remove in production)

volumes:
  mysql_data:
  redis_data: